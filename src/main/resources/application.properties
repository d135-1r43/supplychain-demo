# Demo app: the schema is always recreated from the entities on startup and import.sql is
# replayed into it. Quarkus Dev Services supplies the Postgres in dev, test and integration
# test mode, so there is no datasource to configure.
quarkus.hibernate-orm.database.generation=drop-and-create
# Dev and test pick up import.sql on their own; the packaged app needs to be told.
quarkus.hibernate-orm.sql-load-script=import.sql
