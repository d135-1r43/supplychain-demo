## Builds and tests every push and pull request. On main and on v* tags it also publishes
## the SBOM to Dependency-Track and the container image to GHCR.

name: CI build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # to push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build
        run: ./mvnw verify -B -DskipITs=false

      # 1.0.0 on a v* tag, 1.0.1-SNAPSHOT on main. Used for both the Dependency-Track
      # project version and the image tag, so they always describe the same build.
      - name: Read project version
        id: version
        run: echo "version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: target/*-cyclonedx.json

      # projectName is passed explicitly because the SBOM calls itself "quarkus-run.jar" —
      # without it, autoCreate would name the Dependency-Track project after the JAR.
      - name: Publish SBOM to Dependency-Track
        if: github.event_name != 'pull_request'
        run: |
          curl -sSf -X POST "${{ secrets.DTRACK_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -F autoCreate=true \
            -F projectName=supplychain-demo \
            -F projectVersion=${{ steps.version.outputs.version }} \
            -F bom=@$(ls target/*-cyclonedx.json)

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` tracks the snapshot from main, not the newest release.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The Maven SBOM above describes the Java distribution. This one describes the whole
      # image — UBI 9 base OS packages and the JDK on top of those same jars — scanned from
      # the exact digest that was just pushed. Skipped on PRs, which build but do not push.
      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: target/image-cyclonedx.json
          artifact-name: image-sbom-${{ steps.version.outputs.version }}.json

      # A separate Dependency-Track project so the image and the app SBOM do not overwrite
      # each other — the whole point is to compare what each one contains.
      - name: Publish image SBOM to Dependency-Track
        if: github.event_name != 'pull_request'
        run: |
          curl -sSf -X POST "${{ secrets.DTRACK_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -F autoCreate=true \
            -F projectName=supplychain-demo-image \
            -F projectVersion=${{ steps.version.outputs.version }} \
            -F bom=@target/image-cyclonedx.json
