## Builds and tests every push and pull request, and publishes a container image to GHCR
## for anything that lands on main or is tagged by `mvn release:prepare`.

name: CI build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # to push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      # skipITs defaults to true, so the @QuarkusIntegrationTest suite against the packaged
      # JAR only runs because of the override. Dev Services provides Postgres via Docker.
      - name: Build
        run: ./mvnw verify -B -DskipITs=false

      # On a v* tag this is the version maven-release-plugin set (1.0.0); on main it is the
      # development version (1.0.1-SNAPSHOT). Either way the image tag matches the artifact.
      - name: Read project version
        id: version
        run: echo "version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Pull requests build the image to prove the Dockerfile still works, but stop short of
      # publishing, so the steps below are skipped for them.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` deliberately tracks the snapshot from main rather than the newest release:
      # pulling it should give you what the demo currently looks like. Releases are only
      # reachable under their exact version.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
