## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      # skipITs defaults to true, so the @QuarkusIntegrationTest suite against the packaged
      # JAR only runs because of the override. Dev Services provides Postgres via Docker.
      - name: Build
        run: ./mvnw verify -B -DskipITs=false
