## Builds and tests every push and pull request, and publishes a container image to GHCR
## for anything that lands on main or is tagged by `mvn release:prepare`.

name: CI build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # to push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      # skipITs defaults to true, so the @QuarkusIntegrationTest suite against the packaged
      # JAR only runs because of the override. Dev Services provides Postgres via Docker.
      - name: Build
        run: ./mvnw verify -B -DskipITs=false

      # On a v* tag this is the version maven-release-plugin set (1.0.0); on main it is the
      # development version (1.0.1-SNAPSHOT). Everything downstream — the image tag and the
      # Dependency-Track project version — is derived from this, so they cannot drift apart.
      - name: Read project coordinates
        id: version
        run: |
          echo "version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
          echo "name=$(./mvnw -q -B help:evaluate -Dexpression=project.artifactId -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: target/*-cyclonedx.json
          if-no-files-found: error

      # The SBOM names its own root component after the runnable JAR ("quarkus-run.jar"), and
      # the extension has no setting to change that. Dependency-Track would adopt that name
      # when auto-creating the project, so projectName and projectVersion are passed
      # explicitly here — they take precedence over the document's own metadata.
      - name: Publish SBOM to Dependency-Track
        if: github.event_name != 'pull_request'
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          PROJECT_NAME: ${{ steps.version.outputs.name }}
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${DTRACK_URL:-}" ] || [ -z "${DTRACK_API_KEY:-}" ]; then
            echo "::warning::DTRACK_URL / DTRACK_API_KEY are not configured — skipping SBOM upload."
            exit 0
          fi

          sbom=$(ls target/*-cyclonedx.json)
          echo "Uploading $sbom as $PROJECT_NAME $PROJECT_VERSION"

          # autoCreate lets the first upload of a new version create the project.
          token=$(curl -sS --fail-with-body -X POST "$DTRACK_URL/api/v1/bom" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=$PROJECT_NAME" \
            -F "projectVersion=$PROJECT_VERSION" \
            -F "bom=@$sbom" | jq -r '.token')

          # Ingestion is asynchronous. Without waiting, a green build says nothing about
          # whether Dependency-Track actually accepted the document.
          for _ in $(seq 1 30); do
            processing=$(curl -sS --fail-with-body "$DTRACK_URL/api/v1/bom/token/$token" \
              -H "X-Api-Key: $DTRACK_API_KEY" | jq -r '.processing')
            [ "$processing" = "false" ] && echo "Dependency-Track finished processing." && exit 0
            sleep 5
          done

          echo "::error::Dependency-Track did not finish processing within 150s."
          exit 1

      # Pull requests build the image to prove the Dockerfile still works, but stop short of
      # publishing, so the steps below are skipped for them.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` deliberately tracks the snapshot from main rather than the newest release:
      # pulling it should give you what the demo currently looks like. Releases are only
      # reachable under their exact version.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
